    - action chunking
    - cross-embodiment
    - dexterous manipulation
    - whole-body control
    - mobile manipulation
    - embodied chain-of-thought
    - spatial intelligence
    # Named systems — a mention is almost always a real topical hit.
    - OpenVLA
    - pi0
    - RT-2
    - GR00T
    - Octo
    - RDT
    - Genie
    - Cosmos
    - V-JEPA
    - Dreamer
