# Paper Brief - personalized daily paper discovery config.
# Edit this freely; the GitHub Action picks it up on the next run.

# ---- Sources ----
sources:
  arxiv:
    enabled: true
    # Core embodied-intelligence feeds plus adjacent language, 3D/graphics,
    # and imaging sources where transferable ideas often appear first.
    categories: [cs.RO, cs.CV, cs.LG, cs.AI, cs.CL, cs.GR, eess.IV]
    max_per_category: 60
  huggingface_papers:
    enabled: true
  semantic_scholar_authors:
    enabled: true
    lookback_days: 7

# ---- Relevance ranking ----
# These keywords boost ranking. In broad mode they are not eligibility gates.
keywords:
  high_priority:
    - VLA
    - vision language action
    - embodied intelligence
    - embodied agent
    - robot learning
    - robot manipulation
    - generalist robot policy
    - world model
    - video world model
    - action-conditioned prediction
    - model-based control
    - visuomotor policy
    - robot foundation model
    - spatial intelligence
    - 3D reasoning
  medium_priority:
    - JEPA
    - joint embedding predictive
    - latent world
    - latent action
    - video prediction
    - future prediction
    - representation learning
    - self-supervised learning
    - multimodal learning
    - vision-language model
    - video-language model
    - policy learning
    - imitation learning
    - reinforcement learning
    - diffusion policy
    - flow matching policy
    - planning
    - long-horizon
    - memory
    - test-time adaptation
    - sim-to-real
    - synthetic data
    - data mixture
    - curriculum learning
    - active learning
    - uncertainty
    - causal representation
    - object-centric
    - 3D reconstruction
    - neural rendering
    - egocentric video
    - human-robot interaction
  cross_domain:
    - predictor design
    - representation collapse
    - non-contrastive
    - self-supervised representation
    - SIGReg
    - VICReg
    - layer selection
    - DINOv2
    - V-JEPA
    - predictive coding
    - active inference
    - audio self-supervised
    - mixture of experts
    - efficient attention
    - token compression
    - mechanistic interpretability

authors:
  - Mahmoud Assran
  - Adrien Bardes
  - Mathilde Caron
  - Sergey Levine
  - Chelsea Finn
  - Yuandong Tian
  - Yann LeCun
  - Pieter Abbeel

# ---- Filtering ----
filter:
  # broad = keyword-ranked core plus a reserved zero-keyword exploration slice.
  mode: broad
  llm_cap: 180
  explore_fraction: 0.30
  # Successfully reviewed keys are persisted so old papers are not re-scored.
  seen_path: src/data/seen_papers.json
  min_score: 4
  max_papers_per_day: 25
  bucket_quotas:
    direct: 10
    adjacent: 9
    explore: 6

# ---- LLM annotation ----
# Uses an OpenAI-compatible endpoint. Provide OPENAI_API_KEY and optionally
# OPENAI_BASE_URL as environment variables / GitHub secrets.
llm:
  enabled: true
  triage_model: deepseek-v3.2
  deep_read_model: deepseek-v3.2
  batch_size: 10
  research_profile_path: research_profile.md
