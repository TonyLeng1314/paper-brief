# ---- Filtering ----
filter:
  # broad = keyword-ranked core plus a reserved zero-keyword exploration slice.
  mode: broad
  llm_cap: 180
  # The exploration slice is sampled by hash, i.e. randomly. It is worth a few
  # slots for serendipity, not a third of the brief.
  explore_fraction: 0.15
  # Reserved share of `llm_cap` for papers with only weak signal (medium/cross
  # keywords, no high-priority hit). Without it a busy VLA day fills all 180
  # candidate slots with 10-25 point papers and a 2-point neuroscience paper
  # never reaches the LLM at all — the cross-field lane would exist only at
  # fetch time. Unused slots flow back to the core lane.
  adjacent_fraction: 0.3
  # Successfully reviewed keys are persisted so old papers are not re-scored.
  seen_path: src/data/seen_papers.json
  min_score: 5
  max_papers_per_day: 30
  # `direct` used to cap at 10 and hit that cap on most full days, which cut
  # exactly the papers this brief exists for. `adjacent` and `explore` are the
  # inspiration lanes — cross-field work (neuroscience especially) lands there,
  # so they get real capacity rather than leftovers.
  bucket_quotas:
    direct: 15
    adjacent: 10
    explore: 5

# ---- LLM annotation ----
# Uses an OpenAI-compatible endpoint. Provide OPENAI_API_KEY and optionally
# OPENAI_BASE_URL as environment variables / GitHub secrets.
llm:
  enabled: true
  triage_model: deepseek-v4-flash
  deep_read_model: deepseek-v4-flash
  # Fast deterministic triage; reserve reasoning tokens for full-paper reading.
  triage_thinking: false
  deep_read_thinking: true
  # Small batches with generous headroom: a truncated reply costs a retry of
  # that chunk, not the whole batch.
  batch_size: 5
  max_tokens: 16000
  research_profile_path: research_profile.md
