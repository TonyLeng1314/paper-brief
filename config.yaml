# Paper Brief - personalized daily paper discovery config.
# Edit this freely; the GitHub Action picks it up on the next run.

# ---- Sources ----
sources:
  arxiv:
    enabled: true
    # `categories` is a recency firehose. Only put small, on-topic feeds here:
    # taking the newest N from cs.CV or cs.LG just samples the last two hours.
    categories: [cs.RO]
    max_per_category: 150
    # Large categories are searched by topic instead of by recency, so a world
    # model paper posted to cs.LG without a cs.RO cross-list still shows up.
    #
    # Each lane carries its own categories. Running the neuro terms against the
    # CS categories returned 2 q-bio.NC papers out of 100 — "replay" matches
    # every RL replay buffer, and cs.AI out-publishes q-bio.NC by two orders of
    # magnitude, so on a date-sorted page the brain papers never appear. The
    # same terms restricted to q-bio.NC returned 78 out of 100.
    max_per_topic_query: 100
    topic_lanes:
      - name: embodied
        categories: [cs.CV, cs.LG, cs.AI, cs.CL, cs.GR, cs.MA, eess.SY]
        terms:
          - vision-language-action
          - embodied
          - world model
          - robot manipulation
          - robot policy
          - robot learning
          - latent action
          - action-conditioned
          - visuomotor
          - manipulation policy
          - dexterous manipulation
          - humanoid
          - egocentric video
          - affordance
          - sim-to-real
          - spatial reasoning
          - physical reasoning
          - video prediction
          - JEPA
          - diffusion policy

      # Brain work, searched where brain work is posted. Terms may be loose
      # here ("replay", "motor control") because the category does the filtering.
      - name: neuro
        categories: [q-bio.NC]
        terms:
          - sensorimotor
          - motor control
          - motor cortex
          - cerebellum
          - hippocampal
          - place cells
          - grid cells
          - cognitive map
          - replay
          - predictive coding
          - active inference
          - internal model
          - forward model
          - efference copy
          - mental simulation
          - embodied cognition
          - neural population geometry
          - successor representation
          - free energy principle

      # Brain-inspired work posted to the CS categories. Terms must be tight
      # here for the opposite reason: no category filter is doing the work.
      - name: neuro-in-ml
        categories: [cs.LG, cs.AI, cs.NE, cs.CV]
        terms:
          - predictive coding
          - active inference
          - free energy principle
          - efference copy
          - cognitive map
          - grid cells
          - place cells
          - successor representation
          - neural population geometry
          - embodied cognition
          - hippocampal replay
    # A total arxiv failure (HTTP 429) aborts the run instead of publishing an
    # HF-only brief and poisoning seen_papers.json with it.
    required: true
  huggingface_papers:
    enabled: true
  semantic_scholar_authors:
    enabled: true
    lookback_days: 7

# ---- Relevance ranking ----
# These keywords boost ranking. In broad mode they are not eligibility gates.
# Weights live in scripts/filter.py: high 5.0 / medium 1.0 / cross 0.5.
# Keep `medium` free of generic ML vocabulary — three generic hits must never
# outrank one real high-priority hit.
